# Plugin configuration for testing
configuration:
    pageTitle: Plugin Test Site
    enableSPA: true
    enablePopovers: true
    locale: en-US
    baseUrl: localhost
    ignorePatterns:
        - private
        - .obsidian
    theme:
        typography:
            header: Inter
            body: Inter
            code: monospace
        colors:
            lightMode:
                light: "#faf8f8"
                lightgray: "#e5e5e5"
                gray: "#b8b8b8"
                darkgray: "#4e4e4e"
                dark: "#2b2b2b"
                secondary: "#284b63"
                tertiary: "#84a59d"
                highlight: "rgba(143, 159, 169, 0.15)"
                textHighlight: "#fff23688"
            darkMode:
                light: "#161618"
                lightgray: "#393639"
                gray: "#646464"
                darkgray: "#d4d4d4"
                dark: "#ebebec"
                secondary: "#7b97aa"
                tertiary: "#84a59d"
                highlight: "rgba(143, 159, 169, 0.15)"
                textHighlight: "#b3aa0288"
plugins:
    # Date handling
    - source: "@quartz-community/created-modified-date"
      enabled: true
      options:
          defaultDateType: modified
          priority:
              - frontmatter
              - filesystem
      order: 10
    # Syntax highlighting with custom theme
    - source: "@quartz-community/syntax-highlighting"
      enabled: true
      options:
          theme:
              light: github-light
              dark: github-dark
      order: 20
    - source: "@quartz-community/obsidian-flavored-markdown"
      enabled: true
      order: 30
    - source: "@quartz-community/github-flavored-markdown"
      enabled: true
      order: 40
    # Table of contents in right sidebar
    - source: "@quartz-community/table-of-contents"
      enabled: true
      order: 50
      layout:
          position: right
          priority: 30
    - source: "@quartz-community/crawl-links"
      enabled: true
      order: 60
    - source: "@quartz-community/description"
      enabled: true
      order: 70
    # LaTeX disabled for this site
    - source: "@quartz-community/latex"
      enabled: false
      order: 80
    - source: "@quartz-community/explorer"
      enabled: true
      layout:
          position: left
          priority: 50
    # Graph in right sidebar
    - source: "@quartz-community/graph"
      enabled: true
      layout:
          position: right
          priority: 10
    # Search disabled
    - source: "@quartz-community/search"
      enabled: false
      layout:
          position: left
          priority: 20
    - source: "@quartz-community/content-page"
      enabled: true
